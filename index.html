<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- 1. ANTI-CACHE CONFIGURATION (Forces mobile Chrome to fetch fresh configurations) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Noesis - Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 400px;
        }
        .loader {
            border: 4px solid #e1e4e6;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 20px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            color: #ffffff;
            background-color: #007bff;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            padding: 12px 24px;
            border-radius: 6px;
            box-shadow: 0 2px 4px rgba(0,123,255,0.2);
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        // 2. AUTOMATIC REDIRECTION INTERCEPTOR
        (function() {
            // YOUR EXACT APPS SCRIPT URL IS DIRECTLY EMBEDDED RIGHT HERE:
            var secureTargetUrl = "https://script.google.com/macros/s/AKfycbx8mr-yRl0557XRPmUy83rD8ihyqsmH4ZfS1G2Ml8vgg_FVXxayMHMTd_i8DFJQiAVd/exec";

</head>

</html>
